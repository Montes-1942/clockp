
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reloj Digital</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="page-container">

        <!-- TARJETA SUPERIOR: SLIDER -->

        <section class="slider-container">

            <div class="slides">

                <div class="slide active">
                    <img src="images/foto1.jpg" alt="Primera fotografía">
                </div>

                <div class="slide">
                    <img src="images/foto2.jpg" alt="Segunda fotografía">
                </div>

                <div class="slide">
                    <img src="images/foto3.jpg" alt="Tercera fotografía">
                </div>

                <div class="slide">
                    <img src="images/foto4.jpg" alt="Cuarta fotografía">
                </div>

            </div>

            <div class="slider-overlay"></div>

            <div class="slider-dots">
                <button class="active" aria-label="Mostrar fotografía 1" aria-current="true"></button>
                <button aria-label="Mostrar fotografía 2"></button>
                <button aria-label="Mostrar fotografía 3"></button>
                <button aria-label="Mostrar fotografía 4"></button>
            </div>

        </section>

        <!-- TARJETA INFERIOR: RELOJ -->

        <section class="clock-container">

            <div id="time" class="time"></div>

            <div id="date" class="date"></div>

        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
